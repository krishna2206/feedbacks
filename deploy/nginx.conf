# Rendered by the nginx image entrypoint (envsubst): ${API_UPSTREAM}, ${ZERO_UPSTREAM}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Keep the scheme set by an outer proxy (Traefik, Cloudflare…), else use ours
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
  listen 80;
  server_name _;
  # Resolve upstreams through Docker's DNS at request time (not once at startup), so a restarted
  # container with a new IP is picked up without reloading nginx
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://${API_UPSTREAM};
  set $zero_upstream http://${ZERO_UPSTREAM};
  root /usr/share/nginx/html;
  # Attachments: UPLOAD_MAX_MB (25 by default) + the image preview + multipart overhead
  client_max_body_size 27m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # zero-cache accepts an optional first path segment: /sync/sync/v51/connect
  location /sync/ {
    proxy_pass $zero_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Hashed assets: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
