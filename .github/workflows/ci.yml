name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Sync integration test (embedded Postgres + zero-cache + API)
        run: pnpm test:e2e-sync
        timeout-minutes: 10
        env:
          E2E_LOG: ${{ runner.temp }}/e2e-stack.log
      - name: Upload e2e stack log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-log
          path: ${{ runner.temp }}/e2e-stack.log
          if-no-files-found: ignore
